<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" fill="#222">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1240" height="990" fill="#fff"/>
  <text x="20" y="40" font-size="24" font-weight="bold">产品草图：一次完整的使用流程</text>
  <text x="20" y="66" fill="#666">不新增 App 界面，所有交互都发生在现有 client 里（Cursor / Claude Code / Codex）。示例数据为虚构。</text>

  <!-- Panel 1 -->
  <rect x="20" y="90" width="590" height="400" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="115" r="13" fill="#333"/><text x="44" y="120" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <text x="66" y="121" font-size="17" font-weight="bold">开始 session：上下文自动就位</text>
  <rect x="40" y="140" width="550" height="330" rx="6" fill="#fff" stroke="#999"/>
  <rect x="40" y="140" width="550" height="28" rx="6" fill="#eee" stroke="#999"/>
  <circle cx="56" cy="154" r="4" fill="#bbb"/><circle cx="70" cy="154" r="4" fill="#bbb"/><circle cx="84" cy="154" r="4" fill="#bbb"/>
  <text x="100" y="159" fill="#666" font-size="13">任意 client</text>
  <text x="60" y="196" font-weight="bold">已加载的上下文</text>
  <rect x="60" y="208" width="18" height="18" fill="#333"/><text x="64" y="222" fill="#fff" font-size="13">✓</text>
  <text x="88" y="222">个人原则（各 client 的个人配置）</text>
  <rect x="60" y="236" width="18" height="18" fill="#333"/><text x="64" y="250" fill="#fff" font-size="13">✓</text>
  <text x="88" y="250">项目入口 AGENTS.md（约定 · 命令 · 主题索引）</text>
  <rect x="60" y="264" width="18" height="18" fill="none" stroke="#999"/>
  <text x="88" y="278" fill="#888">主题文件：任务涉及时才读取</text>
  <line x1="60" y1="298" x2="570" y2="298" stroke="#ddd"/>
  <rect x="60" y="312" width="510" height="40" rx="6" fill="#f3f3f3"/>
  <text x="75" y="337">我：首页加载太慢，帮我看看</text>
  <rect x="60" y="364" width="510" height="88" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="75" y="388">Agent：这属于「性能」主题，先读 topics/perf.md。</text>
  <text x="75" y="412" fill="#555">已知的坑：CDN 图片不带 ?w= 参数会返回原图（2026-10-02）。</text>
  <text x="75" y="436" fill="#555">先确认这次是不是同一个原因。</text>

  <!-- Panel 2 -->
  <rect x="630" y="90" width="590" height="400" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="654" cy="115" r="13" fill="#333"/><text x="654" y="120" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <text x="676" y="121" font-size="17" font-weight="bold">工作中：脚本优先 · 复用再沉淀</text>
  <rect x="650" y="140" width="550" height="330" rx="6" fill="#fff" stroke="#999"/>
  <rect x="650" y="140" width="550" height="28" rx="6" fill="#eee" stroke="#999"/>
  <circle cx="666" cy="154" r="4" fill="#bbb"/><circle cx="680" cy="154" r="4" fill="#bbb"/><circle cx="694" cy="154" r="4" fill="#bbb"/>
  <rect x="670" y="182" width="510" height="64" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="685" y="206">Agent：这是批量数据转换，直接写临时脚本处理。</text>
  <text x="685" y="230" fill="#555">处理 1,204 行，跳过 3 行（缺少时间戳），已抽样核对。</text>
  <rect x="670" y="256" width="510" height="104" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="685" y="280">Agent：tools/candidates.md 里有同类记录（10-28）。</text>
  <text x="685" y="304" fill="#555">建议沉淀为工具 csv-to-events（skill 格式，进工具库）</text>
  <rect x="685" y="318" width="70" height="28" rx="4" fill="#333"/><text x="720" y="337" fill="#fff" text-anchor="middle">接受</text>
  <rect x="765" y="318" width="70" height="28" rx="4" fill="none" stroke="#999"/><text x="800" y="337" text-anchor="middle">稍后</text>
  <rect x="845" y="318" width="70" height="28" rx="4" fill="none" stroke="#999"/><text x="880" y="337" text-anchor="middle">忽略</text>
  <rect x="670" y="372" width="510" height="62" rx="4" fill="#f3f3f3"/>
  <text x="685" y="395" font-size="13" fill="#555">$ tools/bin/stats csv-to-events</text>
  <text x="685" y="419" font-size="13">调用 7 次 · 成功 6 · 评价 ok 5 / partial 1 · 最近 11-12</text>
  <text x="670" y="456" fill="#888" font-size="12">（没跑过验证的结论会标注“未验证”）</text>

  <!-- Panel 3 -->
  <rect x="20" y="510" width="590" height="440" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="535" r="13" fill="#333"/><text x="44" y="540" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <text x="66" y="541" font-size="17" font-weight="bold">收尾 /distill：agent 提议，我确认</text>
  <rect x="40" y="560" width="550" height="370" rx="6" fill="#fff" stroke="#999"/>
  <rect x="40" y="560" width="550" height="28" rx="6" fill="#eee" stroke="#999"/>
  <circle cx="56" cy="574" r="4" fill="#bbb"/><circle cx="70" cy="574" r="4" fill="#bbb"/><circle cx="84" cy="574" r="4" fill="#bbb"/>
  <text x="60" y="614"><tspan font-weight="bold">摘要</tspan>：首屏慢是首图未懒加载，已改为懒加载。</text>
  <text x="60" y="642" font-weight="bold">提议的修改</text>
  <rect x="60" y="652" width="510" height="72" rx="4" fill="#fafafa" stroke="#ccc"/>
  <text x="72" y="672" font-weight="bold" font-size="13">topics/perf.md</text>
  <text x="400" y="672" font-size="13">[接受]  [修改]  [拒绝]</text>
  <text x="72" y="694" fill="#1a7f37" font-size="13">+ 坑：首图未懒加载导致 LCP 3.8s；正确做法是 loading=lazy</text>
  <text x="72" y="714" fill="#888" font-size="12">理由：可复现，且从代码看不出来</text>
  <rect x="60" y="732" width="510" height="72" rx="4" fill="#fafafa" stroke="#ccc"/>
  <text x="72" y="752" font-weight="bold" font-size="13">AGENTS.md › 待归类</text>
  <text x="400" y="752" font-size="13">[接受]  [修改]  [拒绝]</text>
  <text x="72" y="774" fill="#1a7f37" font-size="13">+ 2026-11-12 · 图片处理 · 上传前需压缩到 500KB 以内</text>
  <text x="72" y="794" fill="#888" font-size="12">理由：这个主题第一次出现，先记在待归类</text>
  <text x="60" y="830"><tspan font-weight="bold">工具评价</tspan>：csv-to-events（r-1112-8f3a）→ ok，结果已核对</text>
  <text x="60" y="856"><tspan font-weight="bold">过期检查</tspan>：perf.md 有 1 条“进行中”已 21 天未更新，建议删除</text>
  <rect x="440" y="878" width="130" height="34" rx="4" fill="#333"/><text x="505" y="900" fill="#fff" text-anchor="middle">确认写入</text>
  <text x="60" y="900" fill="#888" font-size="12">不会自动提交 git</text>

  <!-- Panel 4 -->
  <rect x="630" y="510" width="590" height="440" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="654" cy="535" r="13" fill="#333"/><text x="654" y="540" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
  <text x="676" y="541" font-size="17" font-weight="bold">记忆存在文件里：可读、可改、可进 git</text>
  <text x="660" y="584" font-weight="bold">my-project/（任意项目，不限编码）</text>
  <text x="680" y="612">AGENTS.md</text><text x="880" y="612" fill="#666" font-size="13">入口：约定 · 命令 · 主题索引 · 待归类</text>
  <text x="680" y="638">CLAUDE.md</text><text x="880" y="638" fill="#666" font-size="13">只有一行：@AGENTS.md</text>
  <text x="680" y="664">.agents/memory/</text>
  <text x="700" y="690">topics/perf.md</text><text x="880" y="690" fill="#1a7f37" font-size="13">← 本次写入</text>
  <text x="700" y="716">topics/…</text><text x="880" y="716" fill="#666" font-size="13">同一主题第二次出现时才建</text>
  <text x="700" y="742">decisions.md</text><text x="880" y="742" fill="#666" font-size="13">日期 · 决策 · 理由</text>
  <line x1="660" y1="766" x2="1190" y2="766" stroke="#ddd"/>
  <text x="660" y="792" font-weight="bold">agent-temp-idea/（个人层的源头）</text>
  <text x="680" y="818">prompts/principles.md</text><text x="880" y="818" fill="#666" font-size="13">→ 复制到各 client 的个人配置</text>
  <text x="680" y="844">prompts/distill.md</text><text x="880" y="844" fill="#666" font-size="13">→ 各 client 的收尾命令</text>
  <text x="680" y="870">tools/csv-to-events/</text><text x="880" y="870" fill="#666" font-size="13">→ 工具（skill 格式）+ 使用统计</text>
  <rect x="660" y="882" width="530" height="54" rx="4" fill="#f3f3f3"/>
  <text x="675" y="902" font-size="13" fill="#555">$ git log --oneline -1</text>
  <text x="675" y="924" font-size="13">a1b2c3d  memory: perf 新增 1 条坑，待归类 +1</text>

  <!-- flow arrows between panels -->
  <line x1="610" y1="290" x2="628" y2="290" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="925" y1="490" x2="315" y2="508" stroke="#555" stroke-width="2" stroke-dasharray="0" marker-end="url(#ar)"/>
  <line x1="610" y1="730" x2="628" y2="730" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="20" y="976" fill="#666" font-size="13">④ 写入的记忆会在下一次 session 的第 ① 步被读取，形成闭环。</text>
</svg>
